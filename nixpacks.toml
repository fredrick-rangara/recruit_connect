[phases.setup]
nixPkgs = ["python311", "gcc", "postgresql"]

[phases.install]
cmds = [
  "python3 -m ensurepip --default-pip || true",
  "python3 -m pip install --upgrade pip setuptools wheel || true",
  "python3 -m pip install -r server/requirements.txt || /opt/venv/bin/pip install -r server/requirements.txt"
]

[start]
cmd = "cd server && gunicorn wsgi:app"
